name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: project_hub
          RABBITMQ_DEFAULT_PASS: project_hub
          RABBITMQ_DEFAULT_VHOST: project_hub
        ports:
          - "5672:5672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/project_hub
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/project_hub_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: amqp://project_hub:project_hub@localhost:5672/project_hub
      LOG_LEVEL: INFO
      READINESS_REQUIRE_REDIS: "true"
      READINESS_REQUIRE_RABBITMQ: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create databases
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres project_hub
          PGPASSWORD=postgres createdb -h localhost -U postgres project_hub_test

      - name: Generate JWT key pair
        run: |
          mkdir -p certs
          openssl genrsa -out certs/private.pem 2048
          openssl rsa -in certs/private.pem -pubout -out certs/public.pem

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Mypy
        run: uv run mypy app tests

      - name: Run Bandit
        run: uv run bandit -q -r app -ll

      - name: Run dependency audit
        run: uv run pip-audit

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migration sync
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest -q

      - name: Build Docker image
        run: docker build -t project-hub:ci .
