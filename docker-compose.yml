services:
  api:
    build: .
    container_name: project-hub-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/project_hub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://project_hub:${RABBITMQ_PASSWORD}@rabbitmq:5672/project_hub
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - db
      - redis
      - rabbitmq

  db:
    image: postgres:17-alpine
    container_name: project-hub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_hub
    volumes:
      - project_hub_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: project-hub-redis
    volumes:
      - project_hub_redisdata:/data

  worker: 
    build: .
    container_name: project-hub-worker

    command:
      - uv
      - run
      - celery
      - -A
      - app.jobs.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=prefork
      - --concurrency=1

    environment:
      CELERY_BROKER_URL: amqp://project_hub:${RABBITMQ_PASSWORD}@rabbitmq:5672/project_hub

    depends_on:
      - rabbitmq

    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: project-hub-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: project_hub
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: project_hub

    volumes:
      - project_hub_rabbitmqdata:/var/lib/rabbitmq

    ports:
      - "127.0.0.1:15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  project_hub_pgdata:
  project_hub_redisdata:
  project_hub_rabbitmqdata: